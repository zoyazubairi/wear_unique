<!DOCTYPE html>
<html>
    
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" >
    <title>Contact - Wear Unique</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">
            <a href="#" class="logolink">
                <img class="logoimg" src="/static/images/logo.svg" alt="logo" width="40" height="40">
                <div class="logotext">
                    <span class="logo1">Wear</span>
                    <span class="logo2">Unique</span>
                </div>
            </a>
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="/category/1">Women</a>
            <a href="/category/2">Men</a>
            <a href="/contact">Contact</a>
        </nav>

        <div class="icons">
            <a href="#" class="iconbox">
                <img src="/static/images/account.svg" alt="account" width="22" height="22">
            </a>
        </div>
    </header>

    <div class="contpage">
        <div class="contcard{% if not done %} checkoutcard {% endif %}">
            <p class="contbrand">Wear Unique</p>
            <h2 class="title">My Profile</h2>
            <div class="checkoutrow">
            </div>
        </div>
    </div>

    <footer>
        <div class="footerbox">
            <div class="col">
                <a href="#" class="logolink">
                    <img class="logoimg" src="/static/images/logo.svg" alt="logo" width="34" height="34">
                    <div class="logotext">
                        <span class="logo1">Wear</span>
                        <span class="logo2">Unique</span>
                    </div>
                </a>

                <p>Trendy and affordable clothing for everyone.</p>
            </div>

            <div class="col">
                <h3>Shop</h3>
                <a href="/category/1">Women</a>
                <a href="/category/2">Men</a>
            </div>

            <div class="col">
                <h3>Help</h3>
                <a href="/contact">Contact Us</a>
                <a href="#">Shipping</a>
                <a href="#">Returns</a>
            </div>

            <div class="col">
                <h3>Follow Us</h3>
                <a href="#">Instagram</a>
                <a href="#">Facebook</a>
                <a href="#">Pinterest</a>
            </div>
        </div>

        <div class="bottomtext">
            <p>&copy; 2026 Wear Unique. All rights reserved.</p>
        </div>
    </footer>

</body>

</html>
